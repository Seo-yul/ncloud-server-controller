apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "ncloud-server-controller.fullname" . }}-test-connection"
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "ncloud-server-controller.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      args: ['{{ include "ncloud-server-controller.fullname" . }}:{{ .Values.metrics.service.port }}']
