name: Helm Chart

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

env:
  # Registry and Image Configuration
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/seo-yul/ncloud-server-controller
  
  # Helm Chart Configuration
  HELM_CHART_NAME: ncloud-server-controller
  HELM_CHART_VERSION: 1.0.0
  HELM_CHART_PACKAGE: ncloud-server-controller-1.0.0.tgz
  
  
  # Tool Versions
  GO_VERSION: "1.23"
  HELM_VERSION: "v3.15.0"
  KUBECTL_VERSION: "v1.31.0"
  KIND_VERSION: "latest"

jobs:
  helm-lint:
    name: Helm Lint & Template
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Helm
      uses: azure/setup-helm@v3
      with:
        version: 'v3.15.0'

    - name: Run Helm Operations
      run: |
        make helm-generate
        make helm-lint
        make helm-template

    - name: Helm Summary
      run: |
        echo "## 📦 Helm Chart Results" >> $GITHUB_STEP_SUMMARY
        echo "- **Helm Version**: $(helm version --short)" >> $GITHUB_STEP_SUMMARY
        echo "- **Generate**: ✅ Completed" >> $GITHUB_STEP_SUMMARY
        echo "- **Lint**: ✅ Passed" >> $GITHUB_STEP_SUMMARY
        echo "- **Template**: ✅ Valid" >> $GITHUB_STEP_SUMMARY

  helm-release:
    name: Helm Release & Push
    runs-on: ubuntu-latest
    needs: helm-lint
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    permissions:
      contents: read
      packages: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Helm
      uses: azure/setup-helm@v3
      with:
        version: 'v3.15.0'

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
        logout: false

    - name: Run Complete Helm Pipeline
      run: |
        make helm-all-with-push

    - name: Helm Release Summary
      run: |
        echo "## 🚀 Helm Release Results" >> $GITHUB_STEP_SUMMARY
        echo "- **Chart**: ${{ env.HELM_CHART_NAME }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Version**: ${{ env.HELM_CHART_VERSION }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Registry**: ${{ env.REGISTRY }}/seo-yul" >> $GITHUB_STEP_SUMMARY
        echo "- **Package**: ${{ env.HELM_CHART_PACKAGE }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Status**: ✅ Released" >> $GITHUB_STEP_SUMMARY
