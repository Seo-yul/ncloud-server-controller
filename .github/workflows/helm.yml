name: Helm Chart

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  helm-lint:
    name: Helm Lint
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Helm
      uses: azure/setup-helm@v3
      with:
        version: 'v3.15.0'

    - name: Lint Helm Chart
      run: |
        make helm-lint

    - name: Template Helm Chart
      run: |
        make helm-template

    - name: Helm Summary
      run: |
        echo "## 📦 Helm Chart Results" >> $GITHUB_STEP_SUMMARY
        echo "- **Helm Version**: $(helm version --short)" >> $GITHUB_STEP_SUMMARY
        echo "- **Lint**: ✅ Passed" >> $GITHUB_STEP_SUMMARY
        echo "- **Template**: ✅ Valid" >> $GITHUB_STEP_SUMMARY

  helm-release:
    name: Helm Release
    runs-on: ubuntu-latest
    needs: helm-lint
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Helm
      uses: azure/setup-helm@v3
      with:
        version: 'v3.15.0'

    - name: Package Helm Chart
      run: |
        make helm-package

    - name: Create GitHub Release
      run: |
        gh release create helm-$(date +%Y%m%d-%H%M%S) \
          --title "Helm Chart Release $(date +%Y-%m-%d)" \
          --notes "Automated Helm chart release" \
          dist/*.tgz || echo "Release may already exist"

    - name: Helm Release Summary
      run: |
        echo "## 🚀 Helm Release Results" >> $GITHUB_STEP_SUMMARY
        echo "- **Chart**: ncloud-server-controller" >> $GITHUB_STEP_SUMMARY
        echo "- **Release**: ✅ Created" >> $GITHUB_STEP_SUMMARY
        echo "- **Assets**: dist/*.tgz" >> $GITHUB_STEP_SUMMARY
