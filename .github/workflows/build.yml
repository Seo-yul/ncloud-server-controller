name: Build and Deploy

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

env:
  # Registry and Image Configuration
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/seo-yul/ncloud-server-controller
  
  # Tool Versions
  GO_VERSION: "1.24"

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Setup envtest
      run: |
        echo "🔧 Setting up envtest binaries..."
        mkdir -p $HOME/kubebuilder/bin
        if command -v setup-envtest >/dev/null 2>&1; then
          echo "✅ setup-envtest found, installing binaries..."
          setup-envtest use 1.29.0 --bin-dir $HOME/kubebuilder/bin
          echo "✅ envtest binaries installed in $HOME/kubebuilder/bin"
        else
          echo "⚠️ setup-envtest not found, installing..."
          go install sigs.k8s.io/controller-runtime/tools/setup-envtest@latest
          echo "✅ setup-envtest installed, now installing binaries..."
          setup-envtest use 1.29.0 --bin-dir $HOME/kubebuilder/bin
          echo "✅ envtest binaries installed in $HOME/kubebuilder/bin"
        fi
        echo "🔍 Verifying installation..."
        ls -la $HOME/kubebuilder/bin/ || echo "Directory not found"
        find $HOME/kubebuilder/bin -name "etcd" -type f 2>/dev/null || echo "etcd not found"
        # Set KUBEBUILDER_ASSETS to the actual binary directory path
        echo "KUBEBUILDER_ASSETS=$HOME/kubebuilder/bin/k8s/1.29.0-linux-amd64" >> $GITHUB_ENV

    - name: Build
      run: |
        echo "🔨 Building Go application..."
        echo "Go version: $(go version)"
        echo "Working directory: $(pwd)"
        
        # Run build with detailed error reporting
        if ! make build; then
          echo "❌ Build failed!"
          echo "🔍 Debugging information:"
          echo "Go environment:"
          go env | grep -E "(GOROOT|GOPATH|GOCACHE|GOOS|GOARCH)" || echo "Failed to get Go environment"
          echo "Go modules:"
          go mod verify || echo "Go modules verification failed"
          echo "Available Go files:"
          find . -name "*.go" -type f | head -10 || echo "No Go files found"
          exit 1
        fi
        echo "✅ Build completed successfully!"

    - name: Test (Unit only)
      run: |
        echo "🧪 Running unit tests..."
        echo "KUBEBUILDER_ASSETS: $KUBEBUILDER_ASSETS"
        echo "Go version: $(go version)"
        echo "Working directory: $(pwd)"
        
        # Verify envtest binaries exist
        if [ -n "$KUBEBUILDER_ASSETS" ]; then
          echo "🔍 Verifying envtest binaries..."
          ls -la "$KUBEBUILDER_ASSETS" || echo "KUBEBUILDER_ASSETS directory not found"
          find "$KUBEBUILDER_ASSETS" -name "etcd" -type f 2>/dev/null || echo "etcd binary not found"
          find "$KUBEBUILDER_ASSETS" -name "kube-apiserver" -type f 2>/dev/null || echo "kube-apiserver binary not found"
        else
          echo "⚠️ KUBEBUILDER_ASSETS not set, using default discovery"
        fi
        
        # Run tests with detailed error reporting
        if ! go test -short ./internal/controller/... -v; then
          echo "❌ Unit tests failed!"
          echo "🔍 Debugging information:"
          echo "Go environment:"
          go env | grep -E "(GOROOT|GOPATH|GOCACHE|GOOS|GOARCH)" || echo "Failed to get Go environment"
          echo "Available test packages:"
          go list ./internal/controller/... || echo "Failed to list test packages"
          exit 1
        fi
        echo "✅ Unit tests passed!"

    - name: Build Summary
      run: |
        echo "## 🏗️ Build Results" >> $GITHUB_STEP_SUMMARY
        echo "- **Go Version**: $(go version)" >> $GITHUB_STEP_SUMMARY
        echo "- **Build**: ✅ Success" >> $GITHUB_STEP_SUMMARY
        echo "- **Tests**: ✅ Passed" >> $GITHUB_STEP_SUMMARY

  build-amd64:
    name: Build AMD64 Image
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to GHCR
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.NCLOUD_SERVER_CONTROLLER_REPO }}

    - name: Extract metadata
      id: meta-amd64
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-

    - name: Build and push AMD64 image
      run: |
        echo "🐳 Building AMD64 image..."
        
        # Extract the first tag from the multi-line output
        FIRST_TAG=$(echo "${{ steps.meta-amd64.outputs.tags }}" | head -n1)
        AMD64_TAG="${FIRST_TAG}-amd64"
        
        echo "Original tags: ${{ steps.meta-amd64.outputs.tags }}"
        echo "First tag: $FIRST_TAG"
        echo "AMD64 tag: $AMD64_TAG"
        echo "Platform: linux/amd64"
        
        # Create and use buildx builder
        docker buildx create --name ncloud-server-controller-builder --use || true
        
        # Build and push AMD64 image (no need for Dockerfile.cross with single platform)
        if ! docker buildx build --push --platform=linux/amd64 --tag ${AMD64_TAG} .; then
          echo "❌ AMD64 build failed!"
          echo "🔍 Debugging information:"
          echo "Docker version: $(docker --version)"
          echo "Docker buildx version: $(docker buildx version)"
          echo "Available buildx builders:"
          docker buildx ls || echo "Failed to list builders"
          exit 1
        fi
        
        # Cleanup
        docker buildx rm ncloud-server-controller-builder || true
        
        echo "✅ AMD64 build completed successfully!"

    - name: AMD64 Build Summary
      run: |
        FIRST_TAG=$(echo "${{ steps.meta-amd64.outputs.tags }}" | head -n1)
        AMD64_TAG="${FIRST_TAG}-amd64"
        echo "## 🐳 AMD64 Build Results" >> $GITHUB_STEP_SUMMARY
        echo "- **Platform**: linux/amd64" >> $GITHUB_STEP_SUMMARY
        echo "- **Image**: $AMD64_TAG" >> $GITHUB_STEP_SUMMARY
        echo "- **Status**: ✅ Success" >> $GITHUB_STEP_SUMMARY

  build-arm64:
    name: Build ARM64 Image
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to GHCR
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.NCLOUD_SERVER_CONTROLLER_REPO }}

    - name: Extract metadata
      id: meta-arm64
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-

    - name: Build and push ARM64 image
      run: |
        echo "🐳 Building ARM64 image..."
        
        # Extract the first tag from the multi-line output
        FIRST_TAG=$(echo "${{ steps.meta-arm64.outputs.tags }}" | head -n1)
        ARM64_TAG="${FIRST_TAG}-arm64"
        
        echo "Original tags: ${{ steps.meta-arm64.outputs.tags }}"
        echo "First tag: $FIRST_TAG"
        echo "ARM64 tag: $ARM64_TAG"
        echo "Platform: linux/arm64"
        
        # Create and use buildx builder
        docker buildx create --name ncloud-server-controller-builder --use || true
        
        # Build and push ARM64 image (no need for Dockerfile.cross with single platform)
        if ! docker buildx build --push --platform=linux/arm64 --tag ${ARM64_TAG} .; then
          echo "❌ ARM64 build failed!"
          echo "🔍 Debugging information:"
          echo "Docker version: $(docker --version)"
          echo "Docker buildx version: $(docker buildx version)"
          echo "Available buildx builders:"
          docker buildx ls || echo "Failed to list builders"
          exit 1
        fi
        
        # Cleanup
        docker buildx rm ncloud-server-controller-builder || true
        
        echo "✅ ARM64 build completed successfully!"

    - name: ARM64 Build Summary
      run: |
        FIRST_TAG=$(echo "${{ steps.meta-arm64.outputs.tags }}" | head -n1)
        ARM64_TAG="${FIRST_TAG}-arm64"
        echo "## 🐳 ARM64 Build Results" >> $GITHUB_STEP_SUMMARY
        echo "- **Platform**: linux/arm64" >> $GITHUB_STEP_SUMMARY
        echo "- **Image**: $ARM64_TAG" >> $GITHUB_STEP_SUMMARY
        echo "- **Status**: ✅ Success" >> $GITHUB_STEP_SUMMARY

  create-manifest:
    name: Create Multi-arch Manifest
    runs-on: ubuntu-latest
    needs: [build-amd64, build-arm64]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to GHCR
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.NCLOUD_SERVER_CONTROLLER_REPO }}

    - name: Extract metadata
      id: meta-manifest
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-

    - name: Create and push multi-arch manifest
      run: |
        echo "🐳 Creating multi-architecture manifest..."
        
        # Extract the first tag from the multi-line output
        FIRST_TAG=$(echo "${{ steps.meta-manifest.outputs.tags }}" | head -n1)
        MANIFEST_TAG="${FIRST_TAG}"
        AMD64_TAG="${FIRST_TAG}-amd64"
        ARM64_TAG="${FIRST_TAG}-arm64"
        
        echo "Original tags: ${{ steps.meta-manifest.outputs.tags }}"
        echo "First tag: $FIRST_TAG"
        echo "Manifest tag: $MANIFEST_TAG"
        echo "AMD64 tag: $AMD64_TAG"
        echo "ARM64 tag: $ARM64_TAG"
        echo "Base image: ${{ env.IMAGE_NAME }}"
        
        # Remove existing manifest if it exists to avoid conflicts
        echo "🧹 Cleaning up existing manifest (if any)..."
        docker manifest rm ${MANIFEST_TAG} 2>/dev/null || echo "No existing manifest to remove"
        
        # Create new multi-arch manifest
        echo "🔨 Creating new multi-architecture manifest..."
        if ! docker manifest create ${MANIFEST_TAG} ${AMD64_TAG} ${ARM64_TAG}; then
          echo "❌ Failed to create manifest!"
          echo "🔍 Debugging information:"
          echo "Docker version: $(docker --version)"
          echo "Docker manifest version: $(docker manifest --version || echo 'manifest command not available')"
          echo "Attempting to inspect source images..."
          docker manifest inspect ${AMD64_TAG} || echo "AMD64 image not found"
          docker manifest inspect ${ARM64_TAG} || echo "ARM64 image not found"
          exit 1
        fi
        
        # Annotate manifest with platform information
        echo "🏷️ Annotating manifest with platform information..."
        docker manifest annotate ${MANIFEST_TAG} ${AMD64_TAG} --os linux --arch amd64
        docker manifest annotate ${MANIFEST_TAG} ${ARM64_TAG} --os linux --arch arm64
        
        # Push the manifest
        echo "📤 Pushing multi-architecture manifest..."
        if ! docker manifest push ${MANIFEST_TAG}; then
          echo "❌ Failed to push manifest!"
          echo "🔍 Debugging information:"
          echo "Manifest inspect:"
          docker manifest inspect ${MANIFEST_TAG} || echo "Failed to inspect manifest"
          exit 1
        fi
        
        echo "✅ Multi-arch manifest created and pushed successfully!"

    - name: Multi-arch Manifest Summary
      run: |
        FIRST_TAG=$(echo "${{ steps.meta-manifest.outputs.tags }}" | head -n1)
        MANIFEST_TAG="${FIRST_TAG}"
        AMD64_TAG="${FIRST_TAG}-amd64"
        ARM64_TAG="${FIRST_TAG}-arm64"
        
        echo "## 🎉 Multi-arch Manifest Results" >> $GITHUB_STEP_SUMMARY
        echo "- **Registry**: ${{ env.REGISTRY }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Image**: ${{ env.IMAGE_NAME }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Platforms**: linux/amd64, linux/arm64" >> $GITHUB_STEP_SUMMARY
        echo "- **Build Strategy**: Parallel Multi-runner Build" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📦 Available Images" >> $GITHUB_STEP_SUMMARY
        echo "- **Multi-arch**: \`$MANIFEST_TAG\`" >> $GITHUB_STEP_SUMMARY
        echo "- **AMD64**: \`$AMD64_TAG\`" >> $GITHUB_STEP_SUMMARY
        echo "- **ARM64**: \`$ARM64_TAG\`" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 🔧 Build Process" >> $GITHUB_STEP_SUMMARY
        echo "1. ✅ AMD64 image built and pushed" >> $GITHUB_STEP_SUMMARY
        echo "2. ✅ ARM64 image built and pushed" >> $GITHUB_STEP_SUMMARY
        echo "3. ✅ Multi-arch manifest created and pushed" >> $GITHUB_STEP_SUMMARY
