name: Release and Deploy to GHCR

on:
  push:
    tags:
      - 'v*'  # v1.0.0, v1.2.3 등 태그 푸시 시 실행
  workflow_dispatch:  # 수동 실행 가능

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/seo-yul/ncloud-server-controller
  HELM_CHART_NAME: ncloud-server-controller

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # 전체 히스토리 가져오기 (태그 정보용)

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Extract version from tag
      id: version
      run: |
        if [[ $GITHUB_REF == refs/tags/* ]]; then
          VERSION=${GITHUB_REF#refs/tags/}
          # Remove 'v' prefix if present
          VERSION=${VERSION#v}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          echo "is_release=true" >> $GITHUB_OUTPUT
        else
          VERSION="latest"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=${VERSION}" >> $GITHUB_OUTPUT
          echo "is_release=false" >> $GITHUB_OUTPUT
        fi
        echo "Extracted version: ${VERSION}"
        echo "Is release: ${{ steps.version.outputs.is_release }}"

    - name: Login to GHCR
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.NCLOUD_SERVER_CONTROLLER_REPO }}

    - name: Build and push multi-arch image
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        tags: |
          ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
          ${{ startsWith(steps.version.outputs.version, 'v') && format('{0}:latest', env.IMAGE_NAME) || '' }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Package Helm Chart
      if: startsWith(github.ref, 'refs/tags/v')
      run: |
        # Helm 차트 버전을 태그와 동기화
        CHART_VERSION=${GITHUB_REF#refs/tags/v}
        sed -i "s/^version: .*/version: ${CHART_VERSION}/" helm/${{ env.HELM_CHART_NAME }}/Chart.yaml
        sed -i "s/^appVersion: .*/appVersion: \"${CHART_VERSION}\"/" helm/${{ env.HELM_CHART_NAME }}/Chart.yaml
        
        # Helm 차트 패키징
        helm package helm/${{ env.HELM_CHART_NAME }} -d dist/
        
        # 패키지 정보 출력
        echo "Packaged Helm chart:"
        ls -la dist/
        echo "Chart contents:"
        tar -tzf dist/${{ env.HELM_CHART_NAME }}-${CHART_VERSION}.tgz

    - name: Generate changelog
      id: changelog
      run: |
        # 이전 태그 찾기
        PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
        
        if [ -n "$PREVIOUS_TAG" ]; then
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          git log --pretty=format:"- %s" $PREVIOUS_TAG..HEAD >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        else
          echo "changelog=Initial release" >> $GITHUB_OUTPUT
        fi

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/v')
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.version.outputs.tag }}
        release_name: Release ${{ steps.version.outputs.tag }}
        body: |
          ## 🚀 NCloud Server Controller ${{ steps.version.outputs.tag }}
          
          ### 📦 Container Image
          ```bash
          # Pull the image
          podman pull ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
          
          # Or use latest
          podman pull ${{ env.IMAGE_NAME }}:latest
          ```
          
          ### 🎯 Helm Chart Installation
          ```bash
          # Add Helm repository (if using GitHub releases)
          helm repo add ncloud-server-controller https://github.com/Seo-yul/ncloud-server-controller/releases/download/${{ steps.version.outputs.tag }}/
          
          # Install using Helm
          helm install ncloud-server-controller ncloud-server-controller/ncloud-server-controller
          
          # Or install directly from release
          helm install ncloud-server-controller https://github.com/Seo-yul/ncloud-server-controller/releases/download/${{ steps.version.outputs.tag }}/ncloud-server-controller-${{ steps.version.outputs.version }}.tgz
          ```
          
          ### 🐳 Kubernetes Deployment (Manual)
          ```bash
          kubectl set image deployment/ncloud-server-controller-manager \
            manager=${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }} \
            -n ncloud-system
          ```
          
          ### 📋 Changes
          ${{ steps.changelog.outputs.changelog }}
          
          ### 🔗 Package Registry
          [View on GHCR](https://github.com/seo-yul/packages)
        draft: false
        prerelease: false

    - name: Upload Helm Chart to Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: dist/${{ env.HELM_CHART_NAME }}-${CHART_VERSION}.tgz
        asset_name: ${{ env.HELM_CHART_NAME }}-${CHART_VERSION}.tgz
        asset_content_type: application/gzip

    - name: Update Kubernetes manifests
      if: startsWith(github.ref, 'refs/tags/v')
      run: |
        # 기본 매니페스트의 이미지 태그 업데이트
        if [ -f "config/default/manager/manager.yaml" ]; then
          sed -i "s|image: .*|image: ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}|g" \
            config/default/manager/manager.yaml
        fi
        
        # Kustomize 매니페스트 업데이트
        if [ -f "config/default/kustomization.yaml" ]; then
          # 이미지 태그 업데이트
          sed -i "s|newTag: .*|newTag: ${{ steps.version.outputs.version }}|g" \
            config/default/kustomization.yaml
        fi
        
        echo "Updated manifests for version ${{ steps.version.outputs.version }}"

    - name: Summary
      run: |
        echo "## 🎉 Release Summary" >> $GITHUB_STEP_SUMMARY
        echo "- **Version**: ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Image**: ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Helm Chart**: ${{ env.HELM_CHART_NAME }}-${{ steps.version.outputs.version }}.tgz" >> $GITHUB_STEP_SUMMARY
        echo "- **Registry**: ${{ env.REGISTRY }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Architectures**: linux/amd64, linux/arm64" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 🚀 Next Steps" >> $GITHUB_STEP_SUMMARY
        echo "1. Check the [GitHub Release](https://github.com/${{ github.repository }}/releases)" >> $GITHUB_STEP_SUMMARY
        echo "2. Verify the [GHCR Package](https://github.com/seo-yul/packages)" >> $GITHUB_STEP_SUMMARY
        echo "3. Install using Helm:" >> $GITHUB_STEP_SUMMARY
        echo "   \`\`\`bash" >> $GITHUB_STEP_SUMMARY
        echo "   helm install ncloud-server-controller \\" >> $GITHUB_STEP_SUMMARY
        echo "     https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/${{ env.HELM_CHART_NAME }}-${{ steps.version.outputs.version }}.tgz" >> $GITHUB_STEP_SUMMARY
        echo "   \`\`\`" >> $GITHUB_STEP_SUMMARY
        echo "4. Or update existing deployment:" >> $GITHUB_STEP_SUMMARY
        echo "   \`\`\`bash" >> $GITHUB_STEP_SUMMARY
        echo "   kubectl set image deployment/ncloud-server-controller-manager \\" >> $GITHUB_STEP_SUMMARY
        echo "     manager=${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }} \\" >> $GITHUB_STEP_SUMMARY
        echo "     -n ncloud-system" >> $GITHUB_STEP_SUMMARY
        echo "   \`\`\`" >> $GITHUB_STEP_SUMMARY
