# NCloud 인증 정보를 위한 Secret 예시
apiVersion: v1
kind: Secret
metadata:
  name: ncloud-credentials
  namespace: ncloud-system
type: Opaque
data:
  # Base64로 인코딩된 실제 값
  # echo -n "YOUR_ACCESS_KEY" | base64
  access-key-id: WU9VUl9BQ0NFU1NfS0VZ  # YOUR_ACCESS_KEY
  # echo -n "YOUR_SECRET_KEY" | base64  
  secret-access-key: WU9VUl9TRUNSRVRfS0VZ  # YOUR_SECRET_KEY
---
# 또는 일반 텍스트 시크릿 (주의: 평문 노출 위험)
apiVersion: v1
kind: Secret
metadata:
  name: ncloud-credentials-raw
  namespace: ncloud-system
type: Opaque
stringData:
  access-key-id: "YOUR_ACCESS_KEY"
  secret-access-key: "YOUR_SECRET_KEY"
