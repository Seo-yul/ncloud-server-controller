# This rule is not used by the project ncloud-server-controller itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the server.ncloud.devops.ai.kr.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: ncloud-server-controller
    app.kubernetes.io/managed-by: kustomize
  name: ncloudserver-editor-role
rules:
- apiGroups:
  - server.ncloud.devops.ai.kr
  resources:
  - ncloudservers
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - server.ncloud.devops.ai.kr
  resources:
  - ncloudservers/status
  verbs:
  - get
