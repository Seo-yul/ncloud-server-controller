---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - server.ncloud.devops.ai.kr
  resources:
  - ncloudservers
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - server.ncloud.devops.ai.kr
  resources:
  - ncloudservers/finalizers
  verbs:
  - update
- apiGroups:
  - server.ncloud.devops.ai.kr
  resources:
  - ncloudservers/status
  verbs:
  - get
  - patch
  - update
